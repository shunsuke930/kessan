<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://unpkg.com/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>決算対応ダッシュボード</h1>
      <p id="referenceDateLabel" class="muted"></p>
    </div>
    <div class="header-actions">
      <label class="reference-date-field">基準日
        <input type="date" id="referenceDateInput">
      </label>
      <button id="syncButton" class="btn btn-primary">スプレッドシートと同期</button>
      <span id="saveStatus" class="save-status" style="display:none;"></span>
    </div>
  </header>

  <div id="loading" class="loading">読み込み中...</div>
  <div id="errorBox" class="error-box" style="display:none;"></div>

  <main id="app" style="display:none;">
    <section class="filter-bar">
      <label class="staff-filter-field">担当者で絞り込み
        <select id="staffFilter">
          <option value="">すべての担当者</option>
        </select>
      </label>
      <span id="filteredCountLabel" class="muted"></span>
    </section>

    <section class="action-section">
      <h2>タスク一覧</h2>
      <p class="muted">基準日の前後2ヶ月以内に決算を迎える会社のタスクを一覧表示します。列見出し下のプルダウンで絞り込めます。</p>

      <div class="table-scroll">
        <table id="actionTable">
          <thead>
            <tr>
              <th>フェーズ</th>
              <th>クライアント名</th>
              <th>担当者</th>
              <th>FROM</th>
              <th>TO</th>
              <th>ステータス</th>
              <th>コメント</th>
            </tr>
            <tr class="filter-row">
              <th><select id="filterPhase">
                <option value="">すべて</option>
                <option value="preparation">決算準備</option>
                <option value="settlement">申告・納税</option>
              </select></th>
              <th><select id="filterCustomer"><option value="">すべて</option></select></th>
              <th></th>
              <th></th>
              <th></th>
              <th><select id="filterStatus">
                <option value="">すべて</option>
                <option value="未着手">未着手</option>
                <option value="対応中">対応中</option>
                <option value="完了">完了</option>
              </select></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="actionTableBody"></tbody>
        </table>
      </div>
      <p id="actionEmptyState" class="muted" style="display:none;">該当するタスクはありません。</p>
    </section>

    <section class="annual-section">
      <div class="annual-section-header">
        <h2>年間カレンダー</h2>
        <label class="year-field">対象年
          <input type="number" id="annualYearInput" step="1">
        </label>
        <div class="legend">
          <span class="legend-item"><i class="dot dot-milestone"></i>一般的なマイルストン</span>
          <span class="legend-item"><i class="dot dot-prep"></i>準備期間（決算日の2ヶ月前〜）</span>
          <span class="legend-item"><i class="dot dot-settlement"></i>決算期間（決算日の2ヶ月後まで）</span>
          <span class="legend-item"><i class="dot dot-today"></i>基準日</span>
        </div>
      </div>
      <p class="muted annual-note">
        ※マイルストンは一般的な目安です。実際の期限は個別にご確認ください。
        会社の行は、基準日の前後2ヶ月以内に決算を迎える会社のみ、同じ期間同士をまとめて表示します。
      </p>
      <div id="milestoneStripContainer" class="milestone-strip"></div>
      <div id="annualGanttContainer" class="gantt-container annual-gantt"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span id="appVersionLabel" class="muted"></span>
  </footer>

  <div id="editModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2 id="editModalTitle">タスク編集</h2>
      <label>タスク名
        <input type="text" id="editTaskName">
      </label>
      <div class="field-row">
        <label>開始日
          <input type="date" id="editPlannedStart">
        </label>
        <label>期限日
          <input type="date" id="editPlannedEnd">
        </label>
      </div>
      <div class="field-row">
        <label>進捗
          <select id="editProgressStatus">
            <option value="未着手">未着手</option>
            <option value="対応中">対応中</option>
            <option value="完了">完了</option>
          </select>
        </label>
        <label>ステータス手動指定
          <select id="editManualOverride">
            <option value="">自動判定</option>
            <option value="normal">通常（グレー）</option>
            <option value="warning">要注意（黄色）</option>
            <option value="delayed">遅延（赤）</option>
          </select>
        </label>
      </div>
      <label>メモ
        <textarea id="editNotes" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button id="cancelEditButton" class="btn">キャンセル</button>
        <button id="saveEditButton" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <?!= include('JavaScript'); ?>
</body>
</html>
