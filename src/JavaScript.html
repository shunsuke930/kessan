<script>
  var STATUS_LABEL = { normal: '通常', warning: '要注意', delayed: '遅延' };
  var latestData = null;
  var latestAnnualData = null;

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('referenceDateInput').value = toLocalIsoDate(new Date());
    document.getElementById('annualYearInput').value = new Date().getFullYear();
    load();
    loadAnnualView();
    document.getElementById('syncButton').addEventListener('click', onSync);
    document.getElementById('referenceDateInput').addEventListener('change', load);
    document.getElementById('annualYearInput').addEventListener('change', loadAnnualView);
    document.getElementById('staffFilter').addEventListener('change', applyFilter);
    document.getElementById('cancelEditButton').addEventListener('click', closeEditModal);
    document.getElementById('saveEditButton').addEventListener('click', onSaveEdit);
  });

  function toLocalIsoDate(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function getReferenceDate() {
    return document.getElementById('referenceDateInput').value || '';
  }

  // "Month index" (year*12 + month) so a ±2-month window can be compared
  // with a single integer subtraction regardless of year boundaries.
  function monthIndex(dateIso) {
    var d = new Date(dateIso);
    return d.getFullYear() * 12 + d.getMonth();
  }

  function isInSeason(fiscalEndDateIso, referenceDateIso) {
    if (!fiscalEndDateIso || !referenceDateIso) return false;
    return Math.abs(monthIndex(fiscalEndDateIso) - monthIndex(referenceDateIso)) <= 2;
  }

  function load() {
    setLoading(true);
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .getDashboardData(getReferenceDate());
  }

  function onSync() {
    setLoading(true);
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .runSyncAndGetDashboardData(getReferenceDate());
  }

  function onDataLoaded(data) {
    latestData = data;
    setLoading(false);
    render(data);
  }

  function onError(error) {
    setLoading(false);
    var box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.textContent = 'エラーが発生しました: ' + (error && error.message ? error.message : error);
  }

  function setLoading(isLoading) {
    document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
    document.getElementById('app').style.display = isLoading ? 'none' : 'block';
  }

  function render(data) {
    document.getElementById('referenceDateLabel').textContent = '基準日: ' + data.referenceDate + '（' + data.caseCount + '件）';
    populateStaffFilter(data.cases);
    applyFilter();
  }

  function getSelectedStaff() {
    return document.getElementById('staffFilter').value || '';
  }

  function populateStaffFilter(cases) {
    var select = document.getElementById('staffFilter');
    var previous = select.value;
    var staffSet = {};
    cases.forEach(function (c) { if (c.staff) staffSet[c.staff] = true; });
    var staffNames = Object.keys(staffSet).sort();

    select.innerHTML = '<option value="">すべての担当者</option>' +
      staffNames.map(function (s) {
        return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
      }).join('');
    if (staffNames.indexOf(previous) !== -1) select.value = previous;
  }

  function getFilteredCases() {
    if (!latestData) return [];
    var staff = getSelectedStaff();
    if (!staff) return latestData.cases;
    return latestData.cases.filter(function (c) { return c.staff === staff; });
  }

  function applyFilter() {
    var filtered = getFilteredCases();
    document.getElementById('filteredCountLabel').textContent =
      latestData ? filtered.length + ' / ' + latestData.cases.length + ' 件を表示中' : '';
    renderActionPanel(filtered);
    renderFilteredAnnualGantt();
  }

  /**
   * "対応が必要なタスク": for cases currently within ±2 months of the
   * reference date (i.e. "in season"), every non-completed task that is
   * 要注意 or 遅延, split into a 準備中 block (today is on/before 決算日)
   * and a 決算中 block (today is after 決算日), soonest deadline first
   * within each block.
   */
  function renderActionPanel(cases) {
    var referenceDate = getReferenceDate();
    var prepItems = [];
    var settlementItems = [];

    cases.forEach(function (c) {
      if (!isInSeason(c.fiscalEndDate, referenceDate)) return;
      var bucket = referenceDate && referenceDate <= c.fiscalEndDate ? prepItems : settlementItems;

      c.tasks.forEach(function (t) {
        if (t.progressStatus === '完了') return;
        if (t.status !== 'warning' && t.status !== 'delayed') return;
        bucket.push({
          customerName: c.customerName,
          staff: c.staff,
          taskId: t.taskId,
          taskName: t.name,
          end: t.end,
          progressStatus: t.progressStatus,
          status: t.status,
          notes: t.notes || ''
        });
      });
    });

    var byEndAsc = function (a, b) { return a.end < b.end ? -1 : (a.end > b.end ? 1 : 0); };
    prepItems.sort(byEndAsc);
    settlementItems.sort(byEndAsc);

    renderActionTable('actionTablePrep', 'actionTablePrepBody', 'actionEmptyPrep', prepItems);
    renderActionTable('actionTableSettlement', 'actionTableSettlementBody', 'actionEmptySettlement', settlementItems);
  }

  function renderActionTable(tableId, bodyId, emptyId, items) {
    var body = document.getElementById(bodyId);
    body.innerHTML = '';
    document.getElementById(tableId).style.display = items.length ? '' : 'none';
    document.getElementById(emptyId).style.display = items.length ? 'none' : 'block';

    items.forEach(function (item) {
      var tr = document.createElement('tr');
      tr.className = 'action-row';

      var checkboxCell = document.createElement('td');
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.addEventListener('change', function () {
        saveInlineTaskField(item.taskId, { progressStatus: checkbox.checked ? '完了' : '未着手' });
      });
      checkboxCell.appendChild(checkbox);

      var nameCell = document.createElement('td');
      nameCell.textContent = item.customerName;

      var staffCell = document.createElement('td');
      staffCell.textContent = item.staff || '-';

      var taskCell = document.createElement('td');
      taskCell.textContent = item.taskName;
      taskCell.className = 'clickable-cell';
      taskCell.addEventListener('click', function () { openEditModal(item.taskId); });

      var endCell = document.createElement('td');
      endCell.textContent = item.end;

      var progressCell = document.createElement('td');
      progressCell.textContent = item.progressStatus;

      var statusCell = document.createElement('td');
      statusCell.innerHTML = '<span class="status-badge ' + item.status + '">' + STATUS_LABEL[item.status] + '</span>';

      var commentCell = document.createElement('td');
      var commentInput = document.createElement('input');
      commentInput.type = 'text';
      commentInput.className = 'comment-input';
      commentInput.value = item.notes;
      commentInput.placeholder = 'コメント';
      commentInput.addEventListener('blur', function () {
        if (commentInput.value !== item.notes) {
          saveInlineTaskField(item.taskId, { notes: commentInput.value });
        }
      });
      commentCell.appendChild(commentInput);

      tr.appendChild(checkboxCell);
      tr.appendChild(nameCell);
      tr.appendChild(staffCell);
      tr.appendChild(taskCell);
      tr.appendChild(endCell);
      tr.appendChild(progressCell);
      tr.appendChild(statusCell);
      tr.appendChild(commentCell);
      body.appendChild(tr);
    });
  }

  function saveInlineTaskField(taskId, updates) {
    setLoading(true);
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .saveTaskUpdate(taskId, updates, getReferenceDate());
  }

  function loadAnnualView() {
    var year = document.getElementById('annualYearInput').value || new Date().getFullYear();
    google.script.run
      .withSuccessHandler(onAnnualDataLoaded)
      .withFailureHandler(onError)
      .getAnnualCalendarData(year);
  }

  function onAnnualDataLoaded(data) {
    latestAnnualData = data;
    renderFilteredAnnualGantt();
  }

  /**
   * Annual calendar: only companies within ±2 months of the reference
   * date are shown (same "in season" rule as the action panel), and rows
   * sharing an identical period (same type + start + end - i.e. the same
   * 決算日) are merged into a single bar listing every company that
   * shares it, instead of one row per company.
   */
  function renderFilteredAnnualGantt() {
    if (!latestAnnualData) return;

    var referenceDate = getReferenceDate();
    var staff = getSelectedStaff();
    var fiscalEndById = {};
    var staffById = {};
    if (latestData) {
      latestData.cases.forEach(function (c) {
        fiscalEndById[c.customerId] = c.fiscalEndDate;
        staffById[c.customerId] = c.staff;
      });
    }

    var rows = latestAnnualData.rows.filter(function (r) {
      if (staff && staffById[r.customerId] !== staff) return false;
      return isInSeason(fiscalEndById[r.customerId], referenceDate);
    });

    var groups = {};
    var groupOrder = [];
    rows.forEach(function (r) {
      var key = r.type + '|' + r.start + '|' + r.end;
      if (!groups[key]) {
        groups[key] = { type: r.type, start: r.start, end: r.end, names: [] };
        groupOrder.push(key);
      }
      groups[key].names.push(r.customerName);
    });
    var groupedRows = groupOrder.map(function (key, i) {
      var g = groups[key];
      var suffix = g.type === 'prep' ? '（準備期間）' : '（決算期間）';
      return { id: 'group' + i, type: g.type, start: g.start, end: g.end, name: g.names.join('、') + suffix };
    });

    var todayMarker = [];
    if (referenceDate && new Date(referenceDate).getFullYear() === latestAnnualData.year) {
      todayMarker.push({ id: 'today_marker', type: 'today-marker', name: '', start: referenceDate, end: referenceDate });
    }

    var container = document.getElementById('annualGanttContainer');
    container.innerHTML = '';

    var tasks = latestAnnualData.milestones.concat(groupedRows).concat(todayMarker).map(function (item) {
      return {
        id: item.id,
        name: item.name,
        start: item.start,
        end: item.end,
        progress: 0,
        custom_class: 'type-' + item.type
      };
    });

    if (!tasks.length) {
      container.innerHTML = '<p class="muted">表示するデータがありません。顧客データを確認するか、「スプレッドシートと同期」をお試しください。</p>';
      return;
    }

    try {
      new Gantt('#annualGanttContainer', tasks, { view_mode: 'Month' });
      drawTodayLine();
    } catch (e) {
      console.error('Annual gantt render failed', e);
      container.innerHTML = '<p class="muted">年間カレンダーの表示に失敗しました: ' + escapeHtml(e.message) + '</p>';
    }
  }

  /**
   * Draws a full-height red vertical line at the reference date. There is
   * no supported way to ask frappe-gantt for a date's pixel position, so
   * instead we let it lay out an invisible same-day marker task (see
   * `type-today-marker` in Stylesheet.html) and read back the x position
   * it computed for that bar - accurate regardless of view mode/version
   * quirks, since it reuses the library's own layout math.
   */
  function drawTodayLine() {
    var wrapper = document.querySelector('#annualGanttContainer .bar-wrapper[data-id="today_marker"]');
    if (!wrapper) return;
    var bar = wrapper.querySelector('.bar');
    var svg = document.querySelector('#annualGanttContainer svg');
    if (!bar || !svg) return;

    var x = bar.getBBox().x;
    var height = svg.getBBox().height;

    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x);
    line.setAttribute('x2', x);
    line.setAttribute('y1', 0);
    line.setAttribute('y2', height);
    line.setAttribute('class', 'today-line');
    svg.appendChild(line);
  }

  function findTask(taskId) {
    for (var i = 0; i < latestData.cases.length; i++) {
      var tasks = latestData.cases[i].tasks;
      for (var j = 0; j < tasks.length; j++) {
        if (tasks[j].taskId === taskId) return tasks[j];
      }
    }
    return null;
  }

  var editingTaskId = null;

  function openEditModal(taskId) {
    var task = findTask(taskId);
    if (!task) return;
    editingTaskId = taskId;

    document.getElementById('editModalTitle').textContent = task.name;
    document.getElementById('editTaskName').value = task.name;
    document.getElementById('editPlannedStart').value = task.start;
    document.getElementById('editPlannedEnd').value = task.end;
    document.getElementById('editProgressStatus').value = task.progressStatus;
    document.getElementById('editManualOverride').value = task.manualOverride || '';
    document.getElementById('editNotes').value = task.notes || '';

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    editingTaskId = null;
    document.getElementById('editModal').style.display = 'none';
  }

  function onSaveEdit() {
    if (!editingTaskId) return;
    var taskId = editingTaskId;
    var updates = {
      taskName: document.getElementById('editTaskName').value,
      plannedStart: document.getElementById('editPlannedStart').value,
      plannedEnd: document.getElementById('editPlannedEnd').value,
      progressStatus: document.getElementById('editProgressStatus').value,
      manualOverride: document.getElementById('editManualOverride').value,
      notes: document.getElementById('editNotes').value
    };

    setLoading(true);
    closeEditModal();
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .saveTaskUpdate(taskId, updates, getReferenceDate());
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
