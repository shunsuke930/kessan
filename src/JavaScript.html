<script>
  var STAFF_COLORS = ['#fde2e2', '#fdebc8', '#e2f0d9', '#dbeafe', '#ede9fe', '#fce7f3', '#e0f2fe', '#fef3c7'];
  var PROGRESS_COLORS = { '未着手': '#e0e2e5', '対応中': '#fdebc8', '完了': '#2f3542' };
  var PROGRESS_TEXT_COLORS = { '未着手': '#333', '対応中': '#7a4a00', '完了': '#fff' };

  var latestData = null;
  var actionFilters = { taskName: '', customerName: '', fiscalPeriod: '', staff: '', progressStatus: '' };

  // Inline edits (ステータス/コメント) are queued here and sent as one
  // saveTaskUpdatesBatch call after a short pause, instead of one
  // google.script.run round trip (and disruptive full-page loading state)
  // per keystroke/change. See queueTaskUpdate / flushPendingUpdates below.
  var pendingUpdates = {};
  var pendingTimer = null;
  var saveStatusHideTimer = null;
  var BATCH_DEBOUNCE_MS = 1000;

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('referenceMonthInput').value = toLocalYearMonth(new Date());
    load();
    document.getElementById('referenceMonthInput').addEventListener('change', load);
    document.getElementById('filterTaskName').addEventListener('change', onActionFilterChange);
    document.getElementById('filterCustomer').addEventListener('change', onActionFilterChange);
    document.getElementById('filterFiscalPeriod').addEventListener('change', onActionFilterChange);
    document.getElementById('filterStaff').addEventListener('change', onActionFilterChange);
    document.getElementById('filterStatus').addEventListener('change', onActionFilterChange);
    window.addEventListener('beforeunload', function () {
      if (hasPendingUpdates()) flushPendingUpdates();
    });
  });

  function onActionFilterChange() {
    actionFilters.taskName = document.getElementById('filterTaskName').value;
    actionFilters.customerName = document.getElementById('filterCustomer').value;
    actionFilters.fiscalPeriod = document.getElementById('filterFiscalPeriod').value;
    actionFilters.staff = document.getElementById('filterStaff').value;
    actionFilters.progressStatus = document.getElementById('filterStatus').value;
    renderActionPanel(latestData ? latestData.rows : []);
  }

  function formatFiscalPeriod(fiscalEndDateIso) {
    if (!fiscalEndDateIso) return '';
    var d = new Date(fiscalEndDateIso);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月期';
  }

  function staffColor(name) {
    if (!name) return '#eee';
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return STAFF_COLORS[hash % STAFF_COLORS.length];
  }

  function toLocalYearMonth(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    return y + '-' + m;
  }

  function getReferenceMonth() {
    return document.getElementById('referenceMonthInput').value || '';
  }

  function load() {
    // A pending batch already fetches a fresh task list as of the current
    // 対象月 when it lands, so let it carry the load instead of racing it
    // with a second, separate fetch.
    if (hasPendingUpdates()) { flushPendingUpdates(); return; }
    setLoading(true);
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .getMonthlyTaskList(getReferenceMonth());
  }

  function onDataLoaded(data) {
    latestData = data;
    setLoading(false);
    render(data);
  }

  function onError(error) {
    setLoading(false);
    var box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.textContent = 'エラーが発生しました: ' + (error && error.message ? error.message : error);
  }

  function setLoading(isLoading) {
    document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
    document.getElementById('app').style.display = isLoading ? 'none' : 'block';
  }

  function render(data) {
    document.getElementById('referenceMonthLabel').textContent = '対象月: ' + data.referenceMonth + '（' + data.rowCount + '件）';
    var versionLabel = document.getElementById('appVersionLabel');
    if (versionLabel && data.version) versionLabel.textContent = 'バージョン: ' + data.version;
    renderActionPanel(data.rows);
  }

  /**
   * "今月のタスク一覧": 対象月を基準に TASK_RULES (Constants.gs) の条件に
   * 一致する会社を自動抽出し、1行1タスクの密な表で表示する
   * （タスク/クライアント名/決算期/担当者/ステータス/コメント）。
   */
  function buildActionRows(rows) {
    return rows.map(function (r) {
      return {
        taskId: r.taskId,
        taskKey: r.taskKey,
        taskName: r.taskName,
        customerName: r.customerName,
        fiscalEndDate: r.fiscalEndDate,
        fiscalPeriod: formatFiscalPeriod(r.fiscalEndDate),
        staff: r.staff,
        progressStatus: r.progressStatus,
        notes: r.notes || ''
      };
    });
  }

  function renderActionPanel(rawRows) {
    var allRows = buildActionRows(rawRows);
    populateActionFilterOptions(allRows);

    var rows = allRows.filter(function (r) {
      if (actionFilters.taskName && r.taskName !== actionFilters.taskName) return false;
      if (actionFilters.customerName && r.customerName !== actionFilters.customerName) return false;
      if (actionFilters.fiscalPeriod && r.fiscalPeriod !== actionFilters.fiscalPeriod) return false;
      if (actionFilters.staff && r.staff !== actionFilters.staff) return false;
      if (actionFilters.progressStatus && r.progressStatus !== actionFilters.progressStatus) return false;
      return true;
    });

    var referenceMonth = getReferenceMonth();

    // A batched save re-renders this table once the write completes; if the
    // user is still focused on a status/comment cell at that moment,
    // preserve that focus (and any not-yet-blurred text) so typing isn't
    // interrupted.
    var focusState = captureActionFocusState();

    var body = document.getElementById('actionTableBody');
    body.innerHTML = '';
    // Keep the table (and its filter-row dropdowns) visible even when the
    // current filter combination matches nothing - only the empty-state
    // message toggles, so the user can still change the filters back.
    document.getElementById('actionEmptyState').style.display = rows.length ? 'none' : 'block';

    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.className = rowStatusClass(r, referenceMonth);

      var taskNameCell = document.createElement('td');
      taskNameCell.textContent = r.taskName;

      var nameCell = document.createElement('td');
      nameCell.textContent = r.customerName;

      var fiscalPeriodCell = document.createElement('td');
      fiscalPeriodCell.textContent = r.fiscalPeriod;

      var staffCell = document.createElement('td');
      var staffChip = document.createElement('span');
      staffChip.className = 'chip';
      staffChip.style.background = staffColor(r.staff);
      staffChip.textContent = r.staff || '-';
      staffCell.appendChild(staffChip);

      var statusCell = document.createElement('td');
      var statusSelect = document.createElement('select');
      statusSelect.className = 'status-select';
      statusSelect.dataset.taskId = r.taskId;
      statusSelect.dataset.field = 'progressStatus';
      ['未着手', '対応中', '完了'].forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        if (v === r.progressStatus) opt.selected = true;
        statusSelect.appendChild(opt);
      });
      applyStatusSelectColor(statusSelect, r.progressStatus);
      statusSelect.addEventListener('change', function () {
        applyStatusSelectColor(statusSelect, statusSelect.value);
        saveInlineTaskField(r.taskId, { progressStatus: statusSelect.value });
      });
      statusCell.appendChild(statusSelect);

      var commentCell = document.createElement('td');
      var commentInput = document.createElement('input');
      commentInput.type = 'text';
      commentInput.className = 'comment-input';
      commentInput.value = r.notes;
      commentInput.placeholder = 'コメント';
      commentInput.dataset.taskId = r.taskId;
      commentInput.dataset.field = 'notes';
      commentInput.addEventListener('input', function () {
        saveInlineTaskField(r.taskId, { notes: commentInput.value });
      });
      commentCell.appendChild(commentInput);

      [taskNameCell, nameCell, fiscalPeriodCell, staffCell, statusCell, commentCell]
        .forEach(function (td) { tr.appendChild(td); });
      body.appendChild(tr);
    });

    restoreActionFocusState(focusState);
  }

  function applyStatusSelectColor(select, value) {
    select.style.background = PROGRESS_COLORS[value] || '#fff';
    select.style.color = PROGRESS_TEXT_COLORS[value] || '#333';
  }

  // 完了 rows are greyed out. Unfinished rows are tinted light red once
  // the 対象月 being viewed is already in the past (relative to today) -
  // there's no longer a per-task deadline to compare against now that
  // 開始/期限 are gone, so "overdue" means "this month's list is history
  // and this task was never marked done".
  function rowStatusClass(r, referenceMonth) {
    if (r.progressStatus === '完了') return 'row-done';
    if (referenceMonth && referenceMonth < toLocalYearMonth(new Date())) return 'row-overdue';
    return '';
  }

  function populateActionFilterOptions(rows) {
    populateFilterSelect('filterCustomer', uniqueSorted(rows.map(function (r) { return r.customerName; })));
    populateFilterSelect('filterFiscalPeriod', uniqueFiscalPeriods(rows));
    populateFilterSelect('filterStaff', uniqueSorted(rows.map(function (r) { return r.staff; })));
  }

  function uniqueSorted(values) {
    var seen = {};
    var out = [];
    values.forEach(function (v) {
      if (v && !seen[v]) { seen[v] = true; out.push(v); }
    });
    return out.sort();
  }

  // Fiscal periods ("2026年6月期") need date order, not string order
  // (string sort would put "2026年12月期" before "2026年6月期").
  function uniqueFiscalPeriods(rows) {
    var seen = {};
    var items = [];
    rows.forEach(function (r) {
      if (r.fiscalPeriod && !seen[r.fiscalPeriod]) {
        seen[r.fiscalPeriod] = true;
        items.push({ label: r.fiscalPeriod, date: r.fiscalEndDate });
      }
    });
    items.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    return items.map(function (i) { return i.label; });
  }

  function populateFilterSelect(id, values, labelMap) {
    var select = document.getElementById(id);
    var previous = select.value;
    select.innerHTML = '<option value="">すべて</option>' + values.map(function (v) {
      var label = labelMap ? (labelMap[v] || v) : v;
      return '<option value="' + escapeHtml(v) + '">' + escapeHtml(label) + '</option>';
    }).join('');
    if (values.indexOf(previous) !== -1) select.value = previous;
  }

  /**
   * Inline edits (ステータス選択・コメント入力) go through here instead of
   * calling the server directly. Each call updates the in-memory task
   * immediately (so the UI never looks stale) and queues the change; a
   * short debounce timer then sends every queued change as a single
   * saveTaskUpdatesBatch call, so a burst of edits across several rows/
   * fields becomes one round trip instead of one per change, and never
   * triggers the full-page "更新中" loading state.
   */
  function saveInlineTaskField(taskId, updates) {
    queueTaskUpdate(taskId, updates);
  }

  function queueTaskUpdate(taskId, updates) {
    pendingUpdates[taskId] = Object.assign(pendingUpdates[taskId] || {}, updates);
    applyOptimisticPatch(taskId, updates);
    setSaveStatus('pending');
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function () { flushPendingUpdates(); }, BATCH_DEBOUNCE_MS);
  }

  function applyOptimisticPatch(taskId, updates) {
    var task = findTask(taskId);
    if (!task) return;
    Object.keys(updates).forEach(function (field) { task[field] = updates[field]; });
  }

  function findTask(taskId) {
    if (!latestData) return null;
    for (var i = 0; i < latestData.rows.length; i++) {
      if (latestData.rows[i].taskId === taskId) return latestData.rows[i];
    }
    return null;
  }

  function hasPendingUpdates() {
    return Object.keys(pendingUpdates).length > 0;
  }

  function flushPendingUpdates(callback) {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    if (!hasPendingUpdates()) { if (callback) callback(); return; }

    var updatesList = Object.keys(pendingUpdates).map(function (taskId) {
      return { taskId: taskId, updates: pendingUpdates[taskId] };
    });
    pendingUpdates = {};

    setSaveStatus('saving');

    google.script.run
      .withSuccessHandler(function (data) {
        latestData = data;
        render(data);
        setSaveStatus('saved');
        if (callback) callback();
      })
      .withFailureHandler(function (error) {
        setSaveStatus('error');
        onError(error);
        if (callback) callback();
      })
      .saveTaskUpdatesBatch(updatesList, getReferenceMonth());
  }

  function setSaveStatus(state) {
    var el = document.getElementById('saveStatus');
    if (!el) return;
    if (saveStatusHideTimer) { clearTimeout(saveStatusHideTimer); saveStatusHideTimer = null; }

    var textByState = {
      pending: '未保存の変更があります…',
      saving: '保存中…',
      saved: '保存しました',
      error: '保存に失敗しました'
    };
    el.textContent = textByState[state] || '';
    el.className = 'save-status save-status-' + state;
    el.style.display = 'inline';

    if (state === 'saved') {
      saveStatusHideTimer = setTimeout(function () { el.style.display = 'none'; }, 2000);
    }
  }

  /**
   * A batched save re-renders the whole action table from fresh server
   * data, which would otherwise steal focus (and any not-yet-queued
   * keystroke) from a status-select or comment-input the user is still
   * using. These capture/restore the focused cell around that re-render.
   */
  function captureActionFocusState() {
    var el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.taskId) return null;
    var state = { taskId: el.dataset.taskId, field: el.dataset.field, value: el.value };
    if (typeof el.selectionStart === 'number') state.selectionStart = el.selectionStart;
    return state;
  }

  function restoreActionFocusState(state) {
    if (!state) return;
    var el = document.querySelector(
      '[data-task-id="' + state.taskId + '"][data-field="' + state.field + '"]'
    );
    if (!el) return;

    if (state.field === 'notes' && el.value !== state.value) {
      el.value = state.value;
      // The keystrokes that produced this value happened on the DOM node
      // being replaced, so re-queue them under the new one.
      saveInlineTaskField(state.taskId, { notes: state.value });
    }
    el.focus();
    if (typeof state.selectionStart === 'number' && el.setSelectionRange) {
      el.setSelectionRange(state.selectionStart, state.selectionStart);
    }
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
