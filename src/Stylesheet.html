<style>
  :root {
    --color-bg: #f7f8fa;
    --color-border: #e0e2e5;
    --color-prep: #4a90d9;
    --color-settlement: #e58e26;
    --color-milestone: #8a6fd6;
    --color-today: #e53935;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    margin: 0;
    background: var(--color-bg);
    color: #1f2328;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .app-header h1 { font-size: 20px; margin: 0; }
  .muted { color: #6a737d; font-size: 13px; margin: 4px 0 0; }

  .header-actions { display: flex; align-items: center; gap: 20px; }

  .legend { display: flex; gap: 14px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-prep { background: var(--color-prep); }
  .dot-settlement { background: var(--color-settlement); }
  .dot-milestone { background: var(--color-milestone); }
  .dot-today { background: var(--color-today); }

  .reference-date-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
  }
  .reference-date-field input {
    padding: 6px 8px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
  }

  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--color-border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .btn-primary:hover { background: #1765cc; }

  .save-status { font-size: 12.5px; padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
  .save-status-pending { background: #f2f3f5; color: #6a737d; }
  .save-status-saving { background: #e3f0fd; color: #1a73e8; }
  .save-status-saved { background: #e6f4ea; color: #1e7e34; }
  .save-status-error { background: #fdecea; color: #c0392b; }

  .loading, .error-box { padding: 40px; text-align: center; color: #6a737d; }
  .error-box { color: #c0392b; white-space: pre-wrap; text-align: left; }

  main { padding: 20px 24px 60px; }

  .action-section {
    margin-bottom: 28px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
  }
  .action-section h2 { font-size: 16px; margin: 0 0 4px; }
  .table-scroll { overflow-x: auto; margin-top: 10px; }

  .comment-input {
    width: 100%;
    min-width: 140px;
    padding: 4px 7px;
    border: 1px solid var(--color-border);
    border-radius: 5px;
    font-size: 12px;
  }
  td.clickable-cell { cursor: pointer; }
  td.clickable-cell:hover { text-decoration: underline; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
  th { background: #fafbfc; font-weight: 600; }
  #actionTable td { white-space: normal; }
  tr.clickable-row { cursor: pointer; }
  tr.clickable-row:hover { background: #f2f6fc; }

  #actionTable thead tr.filter-row th { padding: 4px 6px; background: #f2f3f5; }
  #actionTable thead tr.filter-row select {
    width: 100%;
    padding: 3px 4px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 11px;
    background: #fff;
  }

  #actionTableBody tr.row-overdue { background: #fdecea; }
  #actionTableBody tr.row-done { background: #f5f5f5; }
  #actionTableBody tr.row-done td { color: #9aa0a6; }
  #actionTableBody tr:hover { filter: brightness(0.97); }

  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11.5px;
    white-space: nowrap;
  }

  .status-select {
    padding: 3px 8px;
    border: none;
    border-radius: 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .gantt-container { overflow-x: auto; }

  .empty-state { padding: 40px; text-align: center; color: #6a737d; }

  .annual-section {
    margin-bottom: 28px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
  }
  .annual-section-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .annual-section-header h2 { font-size: 16px; margin: 0; }
  .year-field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #444; }
  .year-field input {
    width: 80px;
    padding: 6px 8px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
  }
  .annual-note { margin-bottom: 10px; }

  .milestone-strip {
    position: relative;
    margin-bottom: 14px;
    padding-top: 20px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: #fafbfc;
    overflow-x: auto;
  }
  .milestone-ruler {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 18px;
  }
  .milestone-tick {
    position: absolute;
    top: 2px;
    font-size: 10px;
    color: #8a8f98;
    white-space: nowrap;
    transform: translateX(2px);
    border-left: 1px solid var(--color-border);
    padding-left: 3px;
    height: 100%;
  }
  .milestone-lanes { position: relative; }
  .milestone-block {
    position: absolute;
    height: 22px;
    line-height: 22px;
    padding: 0 8px;
    border-radius: 4px;
    background: var(--color-milestone);
    color: #fff;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-footer {
    padding: 16px 24px 28px;
    text-align: center;
  }

  /* Frappe Gantt bar coloring for the annual calendar view */
  .annual-gantt .bar-wrapper.type-prep .bar { fill: var(--color-prep); }
  .annual-gantt .bar-wrapper.type-settlement .bar { fill: var(--color-settlement); }
  /* Invisible marker task used only to read the reference date's pixel
     position from frappe-gantt's own layout, then drawn as .today-line. */
  .annual-gantt .bar-wrapper.type-today-marker { opacity: 0; pointer-events: none; }
  .annual-gantt .today-line { stroke: var(--color-today); stroke-width: 2; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: #fff; border-radius: 8px; padding: 20px 24px; width: 420px; max-width: 90vw;
  }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: #444; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px;
  }
  .field-row { display: flex; gap: 12px; }
  .field-row label { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
</style>
