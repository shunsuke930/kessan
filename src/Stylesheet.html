<style>
  :root {
    --color-normal: #9aa0a6;
    --color-warning: #f2b705;
    --color-delayed: #e53935;
    --color-bg: #f7f8fa;
    --color-border: #e0e2e5;
    --color-prep: #4a90d9;
    --color-settlement: #e58e26;
    --color-milestone: #8a6fd6;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    margin: 0;
    background: var(--color-bg);
    color: #1f2328;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .app-header h1 { font-size: 20px; margin: 0; }
  .muted { color: #6a737d; font-size: 13px; margin: 4px 0 0; }

  .header-actions { display: flex; align-items: center; gap: 20px; }

  .legend { display: flex; gap: 14px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-normal { background: var(--color-normal); }
  .dot-warning { background: var(--color-warning); }
  .dot-delayed { background: var(--color-delayed); }
  .dot-prep { background: var(--color-prep); }
  .dot-settlement { background: var(--color-settlement); }
  .dot-milestone { background: var(--color-milestone); }

  .reference-date-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
  }
  .reference-date-field input {
    padding: 6px 8px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
  }

  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--color-border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .btn-primary:hover { background: #1765cc; }

  .loading, .error-box { padding: 40px; text-align: center; color: #6a737d; }
  .error-box { color: #c0392b; white-space: pre-wrap; text-align: left; }

  main { padding: 20px 24px 60px; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .staff-filter-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
  }
  .staff-filter-field select {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }

  .action-section {
    margin-bottom: 28px;
    background: #fff;
    border: 1px solid var(--color-delayed);
    border-radius: 8px;
    padding: 16px;
  }
  .action-section h2 { font-size: 16px; margin: 0 0 4px; }
  .action-section table { margin-top: 10px; }
  .action-row.clickable-row:hover { background: #f2f6fc; }

  .summary { margin-bottom: 28px; background: #fff; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
  th { background: #fafbfc; font-weight: 600; }
  tr.clickable-row { cursor: pointer; }
  tr.clickable-row:hover { background: #f2f6fc; }

  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    color: #fff;
  }
  .status-badge.normal { background: var(--color-normal); }
  .status-badge.warning { background: var(--color-warning); color: #4a3900; }
  .status-badge.delayed { background: var(--color-delayed); }

  .case-list { display: flex; flex-direction: column; gap: 20px; }

  .case-card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
  }

  .case-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .case-card-header h3 { margin: 0; font-size: 15px; }
  .case-meta { font-size: 12px; color: #6a737d; }

  .gantt-container { overflow-x: auto; }

  .empty-state { padding: 40px; text-align: center; color: #6a737d; }

  /* Frappe Gantt bar coloring by computed status */
  .gantt .bar-wrapper.status-normal .bar { fill: var(--color-normal); }
  .gantt .bar-wrapper.status-warning .bar { fill: var(--color-warning); }
  .gantt .bar-wrapper.status-delayed .bar { fill: var(--color-delayed); }
  .gantt .bar-wrapper.status-warning .bar-progress { fill: #c68f00; }
  .gantt .bar-wrapper.status-delayed .bar-progress { fill: #a52a20; }

  .annual-section {
    margin-bottom: 28px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
  }
  .annual-section-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .annual-section-header h2 { font-size: 16px; margin: 0; }
  .year-field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #444; }
  .year-field input {
    width: 80px;
    padding: 6px 8px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
  }
  .annual-note { margin-bottom: 10px; }

  /* Frappe Gantt bar coloring for the annual calendar view */
  .annual-gantt .bar-wrapper.type-milestone .bar { fill: var(--color-milestone); }
  .annual-gantt .bar-wrapper.type-prep .bar { fill: var(--color-prep); }
  .annual-gantt .bar-wrapper.type-settlement .bar { fill: var(--color-settlement); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: #fff; border-radius: 8px; padding: 20px 24px; width: 420px; max-width: 90vw;
  }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: #444; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px;
  }
  .field-row { display: flex; gap: 12px; }
  .field-row label { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
</style>
